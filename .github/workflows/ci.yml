# GitHub Actions for crazy-streamer-toolbox.
#
#   tests      on a push or merge to main, and to a branch named test/<something>. Nowhere else.
#   package    the Windows and the Linux download, on the same branches and for a version tag (v1.2.3)
#   release    for a version tag: puts both downloads on the repository's Releases page
#
# The tests run on Linux and on Windows. Each download is built on its own system and has its own Python.
name: CI

on:
  push:
    branches:
      - main
      - "test/**"
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  tests:
    if: github.ref_type == 'branch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --quiet -r requirements.txt
      # no OBS, no accounts, no screen needed: every program is faked. A failing test's name also goes into
      # the run's annotations (::error::), which can be read without signing in (the logs can't)
      - shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -t . 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAIL|ERROR):|Error: |Exception: " test.log | head -20 | sed 's/^/::error::/'
          exit $status
        env:
          PYTHONPATH: "src${{ runner.os == 'Windows' && ';' || ':' }}."

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            file: crazy-streamer-toolbox-windows.zip
          # an older Ubuntu on purpose: the download runs on every Linux at least as new as this one
          - target: linux
            os: ubuntu-22.04
            file: crazy-streamer-toolbox-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # what the packager says about tkinter goes into the annotations too
      - shell: bash
        run: |
          set -o pipefail
          python -m streamer_toolbox.devtools.package ${{ matrix.target }} 2>&1 | tee package.log
          grep -E "tkinter" package.log | sed 's/^/::notice::/' || true
        env:
          PYTHONPATH: src
      # without a compiler the packager leaves the start program out and only says so: here that is an error
      - name: The Windows download has its start program
        if: matrix.target == 'windows'
        shell: bash
        # no grep -q: it would stop reading at the match and unzip dies of SIGPIPE (exit 141 under pipefail)
        run: unzip -l build/${{ matrix.file }} | grep "crazy-streamer-toolbox-windows/crazy-streamer-toolbox.exe"
      # the three ways to start (his 2026-11-03), and tkinter for Start settings (the embeddable Python has none:
      # the packager copies it from setup-python's)
      - name: The Windows download has its three start files and tkinter
        if: matrix.target == 'windows'
        shell: bash
        run: |
          unzip -l build/${{ matrix.file }} > listing.txt
          grep -E "python/(_tkinter|tcl|tk|zlib)" listing.txt | head -8 || true
          for name in "Start streamer-toolbox.bat" "Start without a window.bat" "Start settings.bat" \
                      "python/_tkinter.pyd" "python/tkinter/__init__.py" "python/tcl/"; do
            grep -F "crazy-streamer-toolbox-windows/$name" listing.txt > /dev/null || { echo "::error::missing: $name"; exit 1; }
          done
      - name: The Linux download has its three start files and tkinter
        if: matrix.target == 'linux'
        run: |
          tar -tzf build/${{ matrix.file }} > listing.txt
          for name in start-linux.sh start-linux-headless.sh start-linux-settings.sh; do
            grep -F "crazy-streamer-toolbox-linux/$name" listing.txt > /dev/null || { echo "::error::missing: $name"; exit 1; }
          done
          grep -E "/tkinter/__init__.py$" listing.txt > /dev/null || { echo "::error::missing: tkinter"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: crazy-streamer-toolbox-${{ matrix.target }}
          path: build/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 14

  # The README's download links point at these two file names of the newest release:
  #   <repository>/releases/latest/download/crazy-streamer-toolbox-windows.zip  and  ...-linux.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # the checkout brings the tag without its message: get the tag itself
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      # The release's text is the tag's message (git tag -a v1.2.3 -m "..."); a tag without one gets one line.
      - name: Release notes from the tag's message
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md 2>/dev/null; then
            echo 'Still in testing: Settings > What you see starts on "Tested".' > notes.md
          fi
          cat notes.md
      # A test version's tag has a "-" (v0.5.0-dev.1, -alpha.1, -beta.1, -rc.1): a pre-release on GitHub. It is
      # never "latest", so the README's links and the toolboxes on normal versions never get it
      - name: A tag with a "-" is a pre-release
        run: |
          case "$GITHUB_REF_NAME" in *-*) echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;; esac
      - run: >
          gh release create "$GITHUB_REF_NAME"
          downloads/crazy-streamer-toolbox-windows.zip
          downloads/crazy-streamer-toolbox-linux.tar.gz
          --repo "$GITHUB_REPOSITORY"
          --title "crazy-streamer-toolbox $GITHUB_REF_NAME"
          --notes-file notes.md
          $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
